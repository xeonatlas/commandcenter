# Machines the command center watches from inside, over the wg-mon tunnel (10.98.0.0/24).
# scripts/enroll-hosts.sh fills in wg_public_key; scripts/render_inventory.py turns this
# file into prometheus/targets/node.yml and hosts/pi/wg-mon-peers.conf.
#
#   host        the label on every metric and alert, and the Machine dashboard's name for it
#   ssh         the workstation's ~/.ssh/config alias
#   tunnel_ip   this machine's wg-mon address; the Pi is 10.98.0.1
#   endpoint    the public address the Pi dials (UDP 51821)
hosts:
  - {host: lightning-a, hostname: ns104901, role: lightning, ssh: warpulse_server_2, tunnel_ip: 10.98.0.11, endpoint: 147.135.30.140, wg_public_key: "1ooLPd9rE/Rr1k1aO/z5dwa3pPbqKH/SC0aCCkr2LCA="}
  - {host: lightning-b, hostname: ns107120, role: lightning, ssh: warpulse_server_b, tunnel_ip: 10.98.0.12, endpoint: 51.81.106.161, wg_public_key: "WHHUDjAYkefjr5bpLfU0GWf8OTOq7hU3Cx4Pfi7aV2I="}
  - {host: x3, hostname: ns572860, role: x3-gateway, ssh: mc-x3-gateway, tunnel_ip: 10.98.0.14, endpoint: 54.39.131.71, wg_public_key: "RSZKo1VGHh9BCkW4npXbWEiR/f+H41RmRe0kSRHzDgg="}
