# Machines the command center watches from inside. scripts/enroll-hosts.sh (`make enroll`)
# sets each one up and fills in wg_public_key; scripts/render_inventory.py turns this file
# into prometheus/targets/*.yml and hosts/pi/wg-mon-peers.conf.
#
#   host        the label on every metric and alert, and the Machine dashboard's name for it
#   ssh         the workstation's ~/.ssh/config alias (the user there needs passwordless sudo)
#   tunnel_ip   this machine's wg-mon address, the Pi being 10.98.0.1; or instead
#   lan_ip      its home LAN address, for machines the Pi reaches directly (no tunnel)
#   endpoint    the public address the Pi dials (UDP 51821); tunnel hosts only
#   exporters   what the :9900 gateway serves besides node: postgres, patroni, etcd, haproxy
hosts:
  - {host: lightning-a, hostname: ns104901, role: lightning, ssh: warpulse_server_2, tunnel_ip: 10.98.0.11, endpoint: 147.135.30.140, exporters: [postgres, patroni, etcd, haproxy], wg_public_key: "1ooLPd9rE/Rr1k1aO/z5dwa3pPbqKH/SC0aCCkr2LCA="}
  - {host: lightning-b, hostname: ns107120, role: lightning, ssh: warpulse_server_b, tunnel_ip: 10.98.0.12, endpoint: 51.81.106.161, exporters: [postgres, patroni, etcd, haproxy], wg_public_key: "WHHUDjAYkefjr5bpLfU0GWf8OTOq7hU3Cx4Pfi7aV2I="}
  - {host: x3, hostname: ns572860, role: x3-gateway, ssh: mc-x3-gateway, tunnel_ip: 10.98.0.14, endpoint: 54.39.131.71, exporters: [], wg_public_key: "RSZKo1VGHh9BCkW4npXbWEiR/f+H41RmRe0kSRHzDgg="}
  - {host: lapi-witness, hostname: LAPI-witness, role: witness, ssh: lapi-witness, lan_ip: 10.0.0.205, exporters: [etcd]}
