# Paths are relative to this file, so the same config is checked on the
# workstation and runs in the container at /etc/prometheus.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: command-center

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels: {host: command-center}

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
        labels: {host: command-center}

  - job_name: node
    file_sd_configs:
      - files: [targets/node.yml]

  # Each host's metrics gateway (:9900), one job per exporter. Targets come from
  # inventory/hosts.yml via scripts/render_inventory.py.
  - job_name: postgres
    metrics_path: /metrics/postgres
    file_sd_configs:
      - files: [targets/postgres.yml]

  - job_name: patroni
    metrics_path: /metrics/patroni
    file_sd_configs:
      - files: [targets/patroni.yml]

  - job_name: etcd
    metrics_path: /metrics/etcd
    file_sd_configs:
      - files: [targets/etcd.yml]

  - job_name: haproxy
    metrics_path: /metrics/haproxy
    file_sd_configs:
      - files: [targets/haproxy.yml]

  - job_name: blackbox
    scrape_interval: 60s
    scrape_timeout: 20s
    metrics_path: /probe
    file_sd_configs:
      - files: [targets/probes.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
