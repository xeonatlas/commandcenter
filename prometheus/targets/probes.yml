# product groups services onto one Grafana page; service is what alerts name.
- labels: {module: http_2xx, service: lightning-api, product: Lightning}
  targets:
    - https://api.lightningapi.dev/health
    - https://api.warpulse.com/health
- labels: {module: http_2xx, service: lightning-site, product: Lightning}
  targets:
    - https://lightningapi.dev/
- labels: {module: http_any_answer, service: lightning-tiles, product: Lightning}
  targets:
    - https://tiles.lightningapi.dev/
- labels: {module: http_2xx, service: ddcloud, product: DD Cloud}
  targets:
    - https://cloud.niallmurray.com/health
- labels: {module: http_any_answer, service: ddcloud-analytics, product: DD Cloud}
  targets:
    - https://analytics.niallmurray.com/
- labels: {module: http_2xx, service: dualdegrees-site, product: DD Cloud}
  targets:
    - https://dualdegrees.io/
- labels: {module: http_2xx, service: warpulse-site, product: Warpulse}
  targets:
    - https://warpulse.com/
    - https://support.warpulse.com/
- labels: {module: http_2xx, service: vaulterm-site, product: Vaulterm}
  targets:
    - https://vaulterm.com/
- labels: {module: http_405, service: vaulterm-waitlist, product: Vaulterm}
  targets:
    - https://vaulterm.com/api/waitlist
- labels: {module: http_2xx, service: vaulterm-updates, product: Vaulterm}
  targets:
    - https://github.com/xeonatlas/termora-releases/releases/latest/download/latest.yml
# The license server (Vercel): activation and refresh, checkout, and the Stripe webhook
# that issues licenses. Each route checks its own secrets, so each is probed.
- labels: {module: http_post_400, service: vaulterm-api, product: Vaulterm}
  targets:
    - https://api.vaulterm.com/v1/activate
    - https://api.vaulterm.com/v1/checkout
    - https://api.vaulterm.com/v1/stripe/webhook
- labels: {module: http_any_answer, service: zelara, product: Zelara}
  targets:
    - https://www.zelara.chat/
    - https://api.zelara.chat/
