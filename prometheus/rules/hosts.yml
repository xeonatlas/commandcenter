groups:
  - name: hosts
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} is not answering scrapes"

      # Forecasts only count when the disk is already fairly full, so a big
      # transient write on an empty disk does not page anyone.
      - alert: DiskFullSoon
        expr: >
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay"}[6h], 4 * 3600) < 0
          and on (instance, device, mountpoint)
          node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.25
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} will fill within 4 hours at the current rate"

      - alert: DiskFullInDays
        expr: >
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay"}[24h], 3 * 86400) < 0
          and on (instance, device, mountpoint)
          node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.40
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} will fill within 3 days at the current rate"

      - alert: MemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} has under 10% memory available"

      - alert: ClockDrift
        expr: abs(node_timex_offset_seconds) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} clock is more than 50 ms off"

      - alert: PiThrottled
        expr: max by (host) (pi_throttle_state{when="now"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} is under-volted or throttled right now"

      # The aggregation drops the metric name, so both sides of `or` carry the
      # same labels and a collector that is both stale and failing yields one alert.
      - alert: PiCollectorStale
        expr: >
          (time() - pi_throttle_collector_last_run_timestamp_seconds > 600)
          or (max by (job, instance, host) (pi_throttle_collector_success) == 0)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} throttle collector is failing or has stopped"

      # postgresql@*.service is Debian's own cluster unit; under Patroni it is always failed.
      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{state="failed", name!~"postgresql@.+"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} failed on {{ $labels.host }}"

      # Handshakes renew every 2 to 2.5 minutes while traffic flows (keepalives and etcd keep it
      # flowing); with the collector's minute and the scrape on top, 5 minutes means gone.
      - alert: TunnelStale
        expr: time() - wireguard_latest_handshake_timestamp_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} has had no WireGuard handshake with {{ $labels.peer }} on {{ $labels.interface }} for {{ $value | humanizeDuration }}"

      - alert: TextfileCollectorFailing
        expr: >
          (time() - cc_textfile_last_run_timestamp_seconds > 600)
          or (min by (job, instance, host) (cc_textfile_success) == 0)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} job and tunnel collector is failing or has stopped"
