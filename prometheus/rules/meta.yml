groups:
  - name: meta
    rules:
      # Routed to healthchecks.io every minute; silence from it is the page.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Always firing; proves the alerting pipeline is alive."

      # node targets are HostDown's; one alert per job and host, not per probe. The host
      # label lets HostDown mute a down host's gateway targets.
      - alert: ScrapeTargetDown
        expr: count by (job, host) (up{job!="node"} == 0) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} {{ $labels.job }} target(s){{ if $labels.host }} on {{ $labels.host }}{{ end }} are not answering scrapes"

      - alert: PrometheusRuleFailures
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Prometheus rule group {{ $labels.rule_group }} is failing to evaluate"

      - alert: AlertNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager failed to deliver to {{ $labels.integration }}"
